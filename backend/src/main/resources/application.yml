spring:
  application:
    name: smart-transit-backend

  datasource:
    url: jdbc:postgresql://127.0.0.1:15433/smart_transit
    username: smart_transit
    password: ${SMART_TRANSIT_DB_PASSWORD}

server:
  port: 8080

mybatis:
  mapper-locations: "classpath*:com/jygis/smarttransit/mapper/**/*.xml"
  configuration:
    map-underscore-to-camel-case: true

# 全部模拟线路共用的车辆数量
transit-simulation-defaults:
  vehicle-count: 3

# 后端车辆模拟配置
transit:
  # 车辆历史轨迹配置
  history:
    # 是否启用历史位置采样
    enabled: true

    # 每辆受监控车辆每 5 秒保存一个历史位置点
    sample-interval-seconds: 5

    # 自动保留最近 1 天历史数据
    retention-days: 1

    # 单辆车一次最多查询 120 分钟
    maximum-query-range-minutes: 120

  simulation:
    enabled: true

    # 每次任务完成后等待 1000 毫秒再执行下一次
    tick-interval-milliseconds: 1000

    # 车辆到站后停留 5 秒
    dwell-duration-seconds: 5

    # 距目标站 60 米时开始减速
    approach-distance-meters: 60

    # 站点距离线路不超过 50 米时，才允许成为投影候选
    maximum-snap-offset-meters: 50

    # 进站最低速度为 3 米/秒
    minimum-approach-speed-meters-per-second: 3

    # 实际间隔低于参考正常间隔的 70% 时判定为串车
    bunching-threshold-ratio: 0.7

    # 实际间隔高于参考正常间隔的 130% 时判定为大间隔
    large-gap-threshold-ratio: 1.3

    # 模拟发生固定延误的车辆
    delay-vehicle-id: simulated-bus-m103-001

    # 每次到达 M103 第 2 站“深圳上沙”时触发额外停靠
    delay-stop-sequence: 2

    # 在普通停靠 5 秒之外额外停靠 300 秒
    extra-dwell-duration-seconds: 300

    # 区域级模拟：304 条线路，车辆数由公共配置统一控制
    routes:
      # M103
      - route-id: route_000185
        vehicle-id-prefix: simulated-bus-m103
        vehicle-count: ${transit-simulation-defaults.vehicle-count}
        speed-meters-per-second: 12

      # M120
      - route-id: route_000193
        vehicle-id-prefix: simulated-bus-m120
        vehicle-count: ${transit-simulation-defaults.vehicle-count}
        speed-meters-per-second: 12

      # 215 路环线
      - route-id: route_000025
        vehicle-id-prefix: simulated-bus-215
        vehicle-count: ${transit-simulation-defaults.vehicle-count}
        speed-meters-per-second: 12

      # 216 路：华富路始发站 → 福田农批市场
      - route-id: route_000027
        vehicle-id-prefix: simulated-bus-216a
        vehicle-count: ${transit-simulation-defaults.vehicle-count}
        speed-meters-per-second: 12

      # 216 路：福田农批市场 → 华富路始发站
      - route-id: route_000028
        vehicle-id-prefix: simulated-bus-216b
        vehicle-count: ${transit-simulation-defaults.vehicle-count}
        speed-meters-per-second: 12

      # 44 路：上梅林 → 石厦南
      - route-id: route_000090
