services:
  postgis:
    image: postgis/postgis:14-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_transit
      POSTGRES_USER: smart_transit
      POSTGRES_PASSWORD: ${SMART_TRANSIT_DB_PASSWORD:?Set SMART_TRANSIT_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - smart_transit_postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_transit -d smart_transit"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  smart_transit_postgis_data: